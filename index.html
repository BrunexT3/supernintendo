<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNES Wishlist - Minha Lista de Desejos</title>
    <link rel="icon" type="image/png" href="images/Super_Nintendo_icon.png">
    <link rel="apple-touch-icon" href="images/Super_Nintendo_icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --snes-purple: #4f2d7f;
            --snes-red: #d32f2f;
            --snes-blue: #1565c0;
            --snes-green: #2e7d32;
            --snes-yellow: #f9a825;
            --snes-gray: #37474f;
            --bg-dark: #0d0d0d;
            --bg-card: #1a1a2e;
            --bg-card-hover: #252545;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        .light-mode {
            --bg-dark: #f5f5f5;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(79, 45, 127, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(21, 101, 192, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(211, 47, 47, 0.05) 0%, transparent 70%);
            animation: bgPulse 15s ease-in-out infinite;
        }

        .light-mode .bg-animation {
            opacity: 0.5;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Scanlines effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            opacity: 0.3;
        }

        .light-mode .scanlines {
            opacity: 0.1;
        }

        /* Header */
        header {
            text-align: center;
            padding: 2rem 1rem;
            position: relative;
        }

        .logo-container {
            display: inline-block;
            position: relative;
        }

        .logo {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            background: linear-gradient(135deg, var(--snes-red), var(--snes-yellow), var(--snes-green), var(--snes-blue));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 5s ease infinite;
            text-shadow: none;
            letter-spacing: 2px;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Progress Section */
        .progress-section {
            max-width: 600px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .progress-stats span {
            font-weight: 600;
            color: var(--snes-yellow);
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .light-mode .progress-bar-container {
            background: rgba(0, 0, 0, 0.1);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--snes-green), var(--snes-blue));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* Controls */
        .controls {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
        }

        .controls-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 1rem;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            max-width: 400px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--snes-purple);
            box-shadow: 0 0 0 3px rgba(79, 45, 127, 0.2);
        }

        .search-box svg {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .control-select {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-select:focus {
            outline: none;
            border-color: var(--snes-purple);
        }

        .toggle-btn {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toggle-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--snes-purple);
            color: var(--text-primary);
        }

        .toggle-btn.active {
            background: var(--snes-purple);
            border-color: var(--snes-purple);
            color: white;
        }

        .toggle-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Filters */
        .filters {
            display: flex;
            justify-content: flex-start;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .filter-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--snes-purple);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--snes-purple);
            border-color: var(--snes-purple);
            color: white;
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            margin-left: auto;
        }

        .action-btn {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .action-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--snes-purple);
            color: var(--text-primary);
        }

        .action-btn svg {
            width: 14px;
            height: 14px;
        }

        /* Grid */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 1.5rem 4rem;
        }

        .container.list-view {
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid var(--border-color);
            cursor: pointer;
            opacity: 0;
            transform: translateY(30px);
            animation: cardFadeIn 0.6s ease forwards;
        }

        .card:nth-child(1) { animation-delay: 0.02s; }
        .card:nth-child(2) { animation-delay: 0.04s; }
        .card:nth-child(3) { animation-delay: 0.06s; }
        .card:nth-child(4) { animation-delay: 0.08s; }
        .card:nth-child(5) { animation-delay: 0.1s; }
        .card:nth-child(6) { animation-delay: 0.12s; }
        .card:nth-child(7) { animation-delay: 0.14s; }
        .card:nth-child(8) { animation-delay: 0.16s; }

        @keyframes cardFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(79, 45, 127, 0.5);
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.3),
                0 0 30px rgba(79, 45, 127, 0.2);
        }

        /* List view card */
        .list-view .card {
            display: flex;
            flex-direction: row;
            border-radius: 12px;
        }

        .list-view .card:hover {
            transform: translateX(5px);
        }

        .list-view .box-art {
            width: 100px;
            min-width: 100px;
            height: 80px;
        }

        .list-view .card-content {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
        }

        .list-view .card-title {
            margin-bottom: 0;
            font-size: 0.9rem;
        }

        .list-view .card-footer {
            border-top: none;
            padding-top: 0;
            margin-left: auto;
            gap: 0.5rem;
        }

        .list-view .comprado-badge {
            position: relative;
            top: auto;
            right: auto;
            flex-direction: row;
            padding: 0.25rem 0.5rem;
            font-size: 0.6rem;
        }

        .list-view .comprado-badge .data {
            font-size: 0.55rem;
        }

        /* Box art */
        .box-art {
            width: 100%;
            height: 200px;
            background: linear-gradient(145deg, #252540, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .light-mode .box-art {
            background: linear-gradient(145deg, #e0e0e0, #f5f5f5);
        }

        .box-art::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.03) 50%, transparent 60%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .box-art-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .light-mode .box-art-placeholder {
            color: rgba(0, 0, 0, 0.3);
        }

        .box-art-placeholder svg {
            width: 48px;
            height: 48px;
            opacity: 0.5;
        }

        .box-art-placeholder span {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .box-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .box-art img {
            transform: scale(1.1);
        }

        .list-view .card:hover .box-art img {
            transform: scale(1.05);
        }

        /* Card content */
        .card-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            min-height: 140px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            min-height: 2.8em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-bottom: 0.5rem;
            min-height: 24px;
        }

        .card-info-area {
            flex: 1;
        }

        .tag {
            padding: 0.2rem 0.5rem;
            background: rgba(79, 45, 127, 0.2);
            border-radius: 10px;
            font-size: 0.65rem;
            color: var(--snes-purple);
            font-weight: 500;
        }

        .light-mode .tag {
            background: rgba(79, 45, 127, 0.15);
        }

        .tag.multiplayer { background: rgba(21, 101, 192, 0.2); color: var(--snes-blue); }
        .tag.raro { background: rgba(211, 47, 47, 0.2); color: var(--snes-red); }
        .tag.caro { background: rgba(249, 168, 37, 0.2); color: #b57600; }
        .tag.homebrew { background: rgba(46, 125, 50, 0.2); color: var(--snes-green); }

        /* Special badges on box art */
        .box-art-badges {
            position: absolute;
            bottom: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .box-art-badge {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .box-art-badge svg {
            width: 16px;
            height: 16px;
        }

        .box-art-badge.raro {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.5);
        }

        .box-art-badge.raro svg {
            color: #fff;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
        }

        .box-art-badge.homebrew {
            background: linear-gradient(135deg, #66bb6a, #2e7d32);
        }

        .box-art-badge.homebrew svg {
            color: white;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
        }

        .list-view .box-art-badges {
            bottom: 4px;
            right: 4px;
        }

        .list-view .box-art-badge {
            width: 22px;
            height: 22px;
        }

        .list-view .box-art-badge svg {
            width: 12px;
            height: 12px;
        }

        /* Priority indicator */
        .priority-indicator {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            z-index: 10;
        }

        .priority-indicator.alta { background: var(--snes-red); box-shadow: 0 0 8px var(--snes-red); }
        .priority-indicator.media { background: var(--snes-yellow); box-shadow: 0 0 8px var(--snes-yellow); }
        .priority-indicator.baixa { background: var(--snes-blue); box-shadow: 0 0 8px var(--snes-blue); }

        .list-view .priority-indicator {
            position: relative;
            top: auto;
            left: auto;
            margin-right: 0.5rem;
        }

        /* Card footer */
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        .genre-tag {
            padding: 0.35rem 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .light-mode .genre-tag {
            background: rgba(0, 0, 0, 0.05);
        }

        .year-badge {
            padding: 0.35rem 0.7rem;
            background: var(--snes-purple);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
        }

        .price-badge {
            padding: 0.35rem 0.7rem;
            background: var(--snes-green);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
        }

        /* Comprado badge */
        .comprado-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--snes-green);
            color: white;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            box-shadow: 0 2px 8px rgba(46, 125, 50, 0.4);
        }

        .comprado-badge .data {
            font-size: 0.5rem;
            font-weight: 400;
            opacity: 0.85;
        }

        .card.comprado {
            border-color: rgba(46, 125, 50, 0.3);
        }

        .card.comprado:hover {
            border-color: rgba(46, 125, 50, 0.6);
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(46, 125, 50, 0.2);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            position: relative;
        }

        .modal-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 20px 20px 0 0;
        }

        .modal-image-placeholder {
            width: 100%;
            height: 250px;
            background: linear-gradient(145deg, #252540, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px 20px 0 0;
        }

        .light-mode .modal-image-placeholder {
            background: linear-gradient(145deg, #e0e0e0, #f5f5f5);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.1);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .modal-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .modal-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .modal-info-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem;
            border-radius: 10px;
        }

        .light-mode .modal-info-item {
            background: rgba(0, 0, 0, 0.05);
        }

        .modal-info-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.25rem;
        }

        .modal-info-value {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .modal-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .modal-status.comprado {
            background: rgba(46, 125, 50, 0.2);
            color: var(--snes-green);
        }

        .modal-status.wishlist {
            background: rgba(79, 45, 127, 0.2);
            color: var(--snes-purple);
        }

        /* No results */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .no-results svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .no-results h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        /* Footer */

        // Filter and sort games
        function getFilteredGames() {
            let filtered = [...games];

            // Search filter
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(g =>
                    g.completo.toLowerCase().includes(query) ||
                    g.citado.toLowerCase().includes(query)
                );
            }

            // Genre filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(g => g.genero === currentFilter);
            }

            // Status filter
            if (currentStatus === 'comprado') {
                filtered = filtered.filter(g => g.comprado);
            } else if (currentStatus === 'wishlist') {
                filtered = filtered.filter(g => !g.comprado);
            }

            // Sort
            switch (currentSort) {
                case 'name-asc':
                    filtered.sort((a, b) => a.completo.localeCompare(b.completo));
                    break;
                case 'name-desc':
                    filtered.sort((a, b) => b.completo.localeCompare(a.completo));
                    break;
                case 'year-asc':
                    filtered.sort((a, b) => (a.lancamento || 9999) - (b.lancamento || 9999));
                    break;
                case 'year-desc':
                    filtered.sort((a, b) => (b.lancamento || 0) - (a.lancamento || 0));
                    break;
                case 'priority':
                    filtered.sort((a, b) => {
                        if (a.comprado && !b.comprado) return 1;
                        if (!a.comprado && b.comprado) return -1;
                        return (priorityOrder[a.prioridade] || 2) - (priorityOrder[b.prioridade] || 2);
                    });
                    break;
                case 'price-asc':
                    filtered.sort((a, b) => (a.preco || 0) - (b.preco || 0));
                    break;
                case 'price-desc':
                    filtered.sort((a, b) => (b.preco || 0) - (a.preco || 0));
                    break;
            }

            return filtered;
        }

        // Render games
        function renderGames() {
            gameListContainer.innerHTML = '';
            const filteredGames = getFilteredGames();

            if (filteredGames.length === 0) {
                gameListContainer.innerHTML =
                    '<div class="no-results">' +
                        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                            '<circle cx="11" cy="11" r="8"/>' +
                            '<path d="M21 21l-4.35-4.35"/>' +
                        '</svg>' +
                        '<h3>Nenhum jogo encontrado</h3>' +
                        '<p>Tente ajustar os filtros ou a busca</p>' +
                    '</div>';
                return;
            }

            filteredGames.forEach((game, index) => {
                gameListContainer.appendChild(createCard(game, index));
            });

            updateProgress();
        }

        // Modal
        function openModal(game) {
            const modalImage = document.getElementById('modal-image');
            const modalImagePlaceholder = document.getElementById('modal-image-placeholder');

            if (game.boxArt) {
                modalImage.src = game.boxArt;
                modalImage.style.display = 'block';
                modalImagePlaceholder.style.display = 'none';
            } else {
                modalImage.style.display = 'none';
                modalImagePlaceholder.style.display = 'flex';
            }

            document.getElementById('modal-title').textContent = game.completo;
            document.getElementById('modal-subtitle').textContent = 'Também conhecido como: ' + game.citado;
            document.getElementById('modal-year').textContent = game.lancamento || 'N/A';
            document.getElementById('modal-genre').textContent = genreLabels[game.genero];
            document.getElementById('modal-price').textContent = game.preco ? 'R$ ' + game.preco : 'N/A';
            document.getElementById('modal-priority').textContent = game.prioridade ? priorityLabels[game.prioridade] : 'N/A';

            const tagsContainer = document.getElementById('modal-tags');
            const modalVisibleTags = game.tags ? game.tags.filter(t => t !== 'raro') : [];
            const isRaro = game.tags && game.tags.includes('raro');
            let modalTagsHtml = modalVisibleTags.map(t => '<span class="tag ' + t.replace(' ', '-') + '">' + t + '</span>').join('');
            if (isRaro) {
                modalTagsHtml += '<span class="tag raro" style="background: linear-gradient(135deg, #ffd700, #ff8c00); color: white;">&#9733; Raro</span>';
            }
            tagsContainer.innerHTML = modalTagsHtml;

            const statusEl = document.getElementById('modal-status');
            if (game.comprado) {
                statusEl.className = 'modal-status comprado';
                statusEl.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20,6 9,17 4,12"/></svg> Comprado em ' + game.dataCompra;
            } else {
                statusEl.className = 'modal-status wishlist';
                statusEl.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Na Lista de Desejos';
            }

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Export
        function exportList() {
            const filteredGames = getFilteredGames();
            let csv = 'Nome,Ano,Gênero,Preço,Prioridade,Status,Tags\n';

            filteredGames.forEach(g => {
                csv += '"' + g.completo + '",' +
                       (g.lancamento || 'N/A') + ',' +
                       genreLabels[g.genero] + ',' +
                       (g.preco ? 'R$ ' + g.preco : 'N/A') + ',' +
                       (g.prioridade ? priorityLabels[g.prioridade] : 'N/A') + ',' +
                       (g.comprado ? 'Comprado' : 'Wishlist') + ',' +
                       '"' + (g.tags || []).join(', ') + '"\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'snes-wishlist.csv';
            link.click();
        }

        // Share
        function shareList() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById('share-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="20,6 9,17 4,12"/></svg> Copiado!';
                setTimeout(() => btn.innerHTML = originalText, 2000);
            });
        }

        // Event listeners
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGames();
        });

        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            renderGames();
        });

        statusSelect.addEventListener('change', (e) => {
            currentStatus = e.target.value;
            renderGames();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderGames();
            });
        });

        viewToggle.addEventListener('click', () => {
            isListView = !isListView;
            gameListContainer.classList.toggle('list-view', isListView);
            document.getElementById('grid-icon').style.display = isListView ? 'none' : 'block';
            document.getElementById('list-icon').style.display = isListView ? 'block' : 'none';
        });

        themeToggle.addEventListener('click', () => {
            isLightMode = !isLightMode;
            document.body.classList.toggle('light-mode', isLightMode);
            document.getElementById('moon-icon').style.display = isLightMode ? 'none' : 'block';
            document.getElementById('sun-icon').style.display = isLightMode ? 'block' : 'none';
        });

        exportBtn.addEventListener('click', exportList);
        shareBtn.addEventListener('click', shareList);

        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Initial render
        renderGames();
        updateProgress();
    </script>
</body>
</html>
